<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Writer of Pages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Writer of Pages</h1>
    <p>Crie sua conta para entrar em nossa biblioteca.</p>

    <form id="cadastro-form">

        <label>Nome</label>
        <input type="text" id="nome" placeholder="Seu nome" required>

        <label>E-mail</label>
        <input type="email" id="email" placeholder="Seu e-mail" required>

        <label>Senha</label>
        <input type="password" id="senha" placeholder="Crie uma senha" required>

        <button type="submit">Criar minha conta</button>
<p id="mensagem"></p>
    </form>

</body><script type="module" src="supabase.js"></script>
</html>
